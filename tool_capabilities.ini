; ============================================================================
; tool_capabilities.ini - EDA tool capabilities (fpga-ip repo)
; ============================================================================
; SPECIFICATION AND USER GUIDE: README.md, "tool_capabilities.ini
; (Specification)" section. This file is machine-parsed configuration; the
; README section is the authoritative specification for the file format,
; vocabulary, and profile semantics.
;
; The file is processed from top to bottom. Section order is significant and
; is the user's responsibility. The required order is:
;
;   [features]                 define the complete feature vocabulary
;   [defaults]                 define the common baseline
;   [tool.*]                   apply matching profiles in file order
;
; Put less-specific profiles before more-specific profiles. The runner must not
; reorder profiles by name, version, or edition. Non-matching tool profiles are
; ignored, but matching profiles are applied in their file order.
;
; Each profile's + / - is applied in order. See README.md,
; "tool_capabilities.ini (Specification)" section, for the full specification.
;
; VHDL-2019 is COARSE: a tool claims only the subsets it verifiably supports.
; See the "Partial language support" section of the doc (4.1).
;
; ADDING YOUR OWN FEATURE: add the token to allowed_features in [features]
; before using it in a profile or a .f manifest. Then declare +<feature> in
; every tool profile that provides it. A feature may be allowable but provided
; by no matching tool; that is a capability mismatch, not a vocabulary error.
; A token not in allowed_features is rejected as an invalid feature name.
;
; Supported tools (profiles in this file):
;   modelsim 2020.1   (INTEL FPGA STARTER EDITION)
;   questa   2025.3   (Altera Starter FPGA Edition-64)
;   vivado   v2023.2 / v2025.2 / v2026.1 (synthesis)
;   xsim     v2023.2 / v2025.2 / v2026.1 (simulation)
; GHDL, Verilator, and Icarus Verilog have no profiles in this file.
; A tool with no profile is rejected by the runner as unsupported.

[features]
; Complete whitelist of allowable feature tokens. Keep this section first.
; Add a custom token here before using it in profiles or .f manifests.
allowed_features = vhdl-93,vhdl-2002,vhdl-2008,vhdl-2019,verilog,systemverilog,uvm,uvvm,osvvm

[defaults]
features = vhdl-93,vhdl-2002,vhdl-2008,verilog,systemverilog

; ============================================================================
; ModelSim 2020.1 - INTEL FPGA STARTER EDITION
;   probe: Model Technology ModelSim - INTEL FPGA STARTER EDITION vsim 2020.1
;          Simulator 2020.02 Feb 28 2020
;   UVVM:  precompiled libraries available
;   VHDL-2019: none (ModelSim 2020.1 predates VHDL-2019 support)
; ============================================================================
[tool.modelsim]
probe = vsim -version
version_re = vsim\s+(\d+\.\d+)
edition_re = INTEL\s+FPGA\s+(STARTER)\s+EDITION
modes = batch,gui,project
features = +uvvm

; versionless profile for the Starter edition (edition-specific profile).
; Empty features = no delta; inherits +uvvm from [tool.modelsim].
[tool.modelsim.starter]
features =

; version + edition profile: 2020.1 Starter.
; Pins the exact lookup match; adds nothing over the chain.
[tool.modelsim.2020.1.starter]
features =

; ============================================================================
; Questa 2025.3 - Altera Starter FPGA Edition-64
;   probe: Questa Altera Starter FPGA Edition-64 vsim 2025.3 Simulator 2025.09
;   UVVM:  precompiled libraries available
;   VHDL-2019: coarse only (interface/mode-view subset not declared).
; ============================================================================
[tool.questa]
probe = vsim -version
version_re = vsim\s+(\d+\.\d+)
edition_re = Altera\s+(Starter)\s+FPGA\s+Edition-64
modes = batch,gui,project
features = +uvvm

; versionless profile for the Starter edition. Empty = no delta (inherits +uvvm).
[tool.questa.starter]
features =

; version level: 2025.3 is where VHDL-2019 (coarse) is added.
[tool.questa.2025.3]
features = +vhdl-2019

; version + edition profile: 2025.3 Starter.
; Pins the exact lookup match; adds nothing over [tool.questa.2025.3].
[tool.questa.2025.3.starter]
features =

; ============================================================================
; Vivado synthesis
;   probe: vivado v2023.2 (64-bit)
;   VHDL-2019: COARSE only (read_vhdl -vhdl2019). No subset tokens declared.
;   No UVVM (the synthesis flow does not use UVVM libraries).
;   All profiled versions share the same tracked features, so only the
;   name-level profile is needed; unlisted versions fall back to it.
; ============================================================================
[tool.vivado]
probe = vivado -version
version_re = vivado v(\d+\.\d+)
modes = batch,gui,project
features = +vhdl-2019

; ============================================================================
; XSim (Vivado Simulator)
;   probe: Vivado Simulator v2026.1
;   VHDL-2019: NONE. xvhdl on Vivado 2023.2 rejects --2019 with
;     ERROR: [XSIM 43-5636] VHDL-2019 is not yet supported.
;   (Vivado synthesis accepts VHDL-2019; the XSim simulator does not.)
;   No UVVM (XSim does not ship UVVM; the repo skips UVVM on xsim).
;   All profiled versions are baseline-only, so name-level suffices.
; ============================================================================
[tool.xsim]
probe = xvhdl -version
version_re = Vivado Simulator v(\d+\.\d+)
modes = batch,gui
